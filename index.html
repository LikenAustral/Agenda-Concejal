<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Concejal Abarca</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFFFFF">
<script>(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("acTema")||"claro");}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

/* ===== TEMA CLARO (principal) ===== */
:root,[data-theme="claro"]{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#EDEBE6; --surface-3:#E4E1DA;
  --border:#E7E4DE; --border-in:#F0EEE9;
  --t1:#10202D; --t2:#4A5560; --t3:#69747C; --t4:#8E979D;
  --fiordo:#0D2B45; --fiordo-ink:#FFFFFF; --blue-soft:#E8EEF4; --blue-soft-t:#3A6187;
  --verde:#3C6B4F; --verde-ink:#FFFFFF; --green-soft:#F2F6F2; --green-soft-b:#DCE7DE;
  --rojo:#B3311B; --ocre:#9A6516;
  --cb:#B6BDC2; --field:#FFFFFF;
  color-scheme:light;
}
/* ===== TEMA OSCURO (misma estructura, mismos componentes) ===== */
[data-theme="oscuro"]{
  --bg:#0F1418; --surface:#171D22; --surface-2:#222A30; --surface-3:#2C353C;
  --border:#2A333A; --border-in:#222A30;
  --t1:#E9EDF0; --t2:#B0BAC2; --t3:#8B959D; --t4:#78838B;
  --fiordo:#7FB0DC; --fiordo-ink:#0A1620; --blue-soft:#16293C; --blue-soft-t:#9CC3E4;
  --verde:#5FA87E; --verde-ink:#08160E; --green-soft:#15231A; --green-soft-b:#274031;
  --rojo:#E4705A; --ocre:#D2A24E;
  --cb:#4A555E; --field:#111619;
  color-scheme:dark;
}

body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;
  max-width:640px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));}
.hidden{display:none !important;}
:focus-visible{outline:2px solid var(--fiordo);outline-offset:2px;border-radius:8px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
button{font-family:inherit;}

/* ---- cabecera ---- */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
.h-title{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1.15;}
.h-sub{font-size:14px;color:var(--t3);margin-top:1px;}
.theme-btn{width:38px;height:38px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--fiordo);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.theme-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
h2.sec{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px;}
h2.sec .count{color:var(--t3);font-weight:600;}
h2.sec.rojo{color:var(--rojo);} h2.sec.gris{color:var(--t3);}

/* ---- bloques ---- */
.blk{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;}
.blk-sep{height:1px;background:var(--border-in);margin-left:49px;}
.blk-sep.plain{margin-left:15px;}

/* ---- filas de tarea ---- */
.trow{display:flex;gap:13px;align-items:flex-start;padding:14px 14px 14px 12px;border-left:3px solid transparent;}
.trow.late{border-left-color:var(--rojo);}
.trow.today{border-left-color:var(--ocre);}
.cb{width:22px;height:22px;border:2px solid var(--cb);border-radius:50%;flex-shrink:0;margin-top:1px;
  background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.cb svg{width:12px;height:12px;stroke:var(--verde-ink);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;}
.trow.done .cb{background:var(--verde);border-color:var(--verde);}
.tbody{flex:1;min-width:0;}
.ttitle{font-size:16px;font-weight:600;line-height:1.35;}
.trow.done .ttitle{color:var(--t3);text-decoration:line-through;}
.tplazo{font-size:13px;margin-top:3px;color:var(--t2);}
.tplazo.rojo{color:var(--rojo);font-weight:700;}
.tplazo.ocre{color:var(--ocre);font-weight:700;}
.tplazo.gris{color:var(--t3);}
.tnote{font-size:13px;color:var(--t3);line-height:1.5;margin-top:4px;}
.tacts{display:flex;gap:6px;margin-top:9px;}
.tbtn{min-height:34px;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);color:var(--t2);}
.tbtn.del{color:var(--rojo);}
.rtag{display:inline-block;font-size:12px;font-weight:600;color:var(--blue-soft-t);background:var(--blue-soft);
  padding:2px 8px;border-radius:8px;margin-top:5px;margin-right:4px;}

/* ---- próximo evento ---- */
.next-evt{background:var(--blue-soft);border-radius:16px;padding:15px 16px;margin-bottom:20px;}
.next-evt .lbl{font-size:13px;font-weight:700;color:var(--blue-soft-t);margin-bottom:8px;}
.next-evt .body{display:flex;gap:14px;align-items:baseline;}
.next-evt .hora{font-size:23px;font-weight:800;color:var(--fiordo);font-variant-numeric:tabular-nums;letter-spacing:-.5px;flex-shrink:0;}
.next-evt .tt{font-size:16px;font-weight:700;line-height:1.3;}
.next-evt .loc{font-size:13px;color:var(--t2);margin-top:2px;}

/* ---- filas de evento ---- */
.erow{display:flex;gap:14px;padding:13px 15px;align-items:baseline;}
.erow .when{font-size:13px;font-weight:700;color:var(--fiordo);font-variant-numeric:tabular-nums;width:84px;flex-shrink:0;}
.erow .when.w-narrow{width:52px;font-size:14px;font-weight:800;}
.erow .when.vence-rojo{color:var(--rojo);font-weight:700;font-size:13px;}
.erow .when.vence-ocre{color:var(--ocre);font-weight:700;font-size:13px;}
.erow .when.vence-neutro{color:var(--t2);font-weight:700;font-size:13px;}
.erow .et{font-size:15px;font-weight:600;line-height:1.35;}
.erow .eloc{font-size:13px;color:var(--t2);margin-top:1px;}
.eacts{display:flex;gap:6px;padding:0 15px 12px;}

/* ---- botones ---- */
.btn-wide{display:block;width:100%;text-align:center;font-size:14px;font-weight:700;color:var(--fiordo);
  padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;margin-bottom:22px;}
.btn-prim{background:var(--fiordo);color:var(--fiordo-ink);border:none;border-radius:12px;
  font-size:15px;font-weight:700;padding:14px;cursor:pointer;width:100%;}
.btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--fiordo);border-radius:12px;
  font-size:15px;font-weight:700;padding:14px;cursor:pointer;width:100%;}
.btn-prim:disabled,.btn-sec:disabled{opacity:.5;cursor:not-allowed;}
.row2{display:flex;gap:9px;margin-bottom:24px;}
.dashed{width:100%;border:1px dashed var(--border);background:none;border-radius:14px;padding:14px;
  color:var(--t3);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;}

/* ---- control segmentado ---- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;}
.seg button{font-size:13px;font-weight:600;padding:7px 15px;border-radius:9px;color:var(--t3);
  background:none;border:none;cursor:pointer;min-height:38px;}
.seg button.on{background:var(--surface);color:var(--fiordo);}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.icon-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fiordo);
  background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 12px;cursor:pointer;min-height:40px;}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.icon-btn.on{background:var(--blue-soft);border-color:var(--blue-soft);}

/* ---- panel filtrar / ordenar ---- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:18px;display:none;}
.panel.open{display:block;}
.panel h3{font-size:13px;font-weight:700;color:var(--t3);margin-bottom:9px;}
.panel h3+.chips{margin-bottom:16px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--t2);cursor:pointer;min-height:38px;}
.chip.on{background:var(--fiordo);border-color:var(--fiordo);color:var(--fiordo-ink);}

/* ---- calendario ---- */
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.arrows{display:flex;gap:6px;}
.arrow{width:38px;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.arrow svg{width:15px;height:15px;stroke:var(--fiordo);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.week-band{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;}
.wb-day{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:8px 1px;cursor:pointer;min-height:52px;}
.wb-day .d{font-size:10px;color:var(--t3);font-weight:600;}
.wb-day .n{font-size:15px;font-weight:700;margin-top:2px;}
.wb-day.fin .d,.wb-day.fin .n{color:var(--t4);}
.wb-day.today{background:var(--verde);border-color:var(--verde);}
.wb-day.today .d{color:var(--verde-ink);opacity:.75;}
.wb-day.today .n{color:var(--verde-ink);}
.wb-day.sel{border-color:var(--fiordo);border-width:2px;padding:7px 0;}
.blk.today-blk{background:var(--green-soft);border-color:var(--green-soft-b);}
.blk.today-blk .blk-sep{background:var(--green-soft-b);}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.weekdays span{text-align:center;font-size:11px;color:var(--t3);font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;}
.day-cell{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:5px 3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.day-cell.other-month{opacity:.3;pointer-events:none;}
.day-cell.today{border-color:var(--verde);border-width:2px;padding:4px 2px;}
.day-cell.today .day-num{color:var(--verde);font-weight:800;}
.day-cell.sel{background:var(--blue-soft);border-color:var(--fiordo);}
.day-num{font-size:13px;font-weight:600;}
.day-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto;}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.dot.evt{background:var(--fiordo);} .dot.late{background:var(--rojo);}
.dot.today{background:var(--ocre);} .dot.fut{background:var(--t3);}
.empty-line{font-size:14px;color:var(--t3);margin-bottom:18px;padding-left:2px;}

/* ---- notas ---- */
.note-field{width:100%;background:var(--field);border:1px solid var(--border);border-radius:16px;padding:16px;
  min-height:112px;font-family:inherit;font-size:16px;color:var(--t1);line-height:1.6;resize:vertical;outline:none;margin-bottom:11px;}
.note-field:focus{border-color:var(--fiordo);}
.note-field::placeholder{color:var(--t4);}
.note-meta{font-size:12px;color:var(--t3);margin:-6px 0 11px;}
.note-item{margin-bottom:20px;}
.note-item .when{font-size:13px;font-weight:700;color:var(--t3);margin-bottom:4px;}
.note-item .txt{font-size:16px;line-height:1.55;white-space:pre-wrap;}
.note-acts{display:flex;gap:6px;margin-top:9px;}

/* ---- preview IA ---- */
.pv{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:18px;display:none;}
.pv h3{font-size:15px;font-weight:700;margin-bottom:11px;}
.pv-task{display:flex;gap:12px;align-items:flex-start;padding:11px;border-radius:12px;background:var(--surface-2);
  margin-bottom:7px;cursor:pointer;border:1.5px solid transparent;}
.pv-task.sel{border-color:var(--fiordo);background:var(--blue-soft);}
.pv-check{width:20px;height:20px;border:2px solid var(--cb);border-radius:6px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;}
.pv-task.sel .pv-check{background:var(--fiordo);border-color:var(--fiordo);}
.pv-check svg{width:11px;height:11px;stroke:var(--fiordo-ink);fill:none;stroke-width:3.4;stroke-linecap:round;}
.pv-t{font-size:15px;font-weight:600;line-height:1.35;}
.pv-m{font-size:12px;color:var(--t3);margin-top:3px;}

/* ---- formularios ---- */
.form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:16px;display:none;}
.form.open{display:block;}
.frow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.frow input,.frow select,.frow textarea{flex:1;min-width:130px;min-height:44px;background:var(--field);
  border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--t1);
  font-family:inherit;font-size:15px;outline:none;}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--fiordo);}
.frow textarea{min-height:66px;resize:vertical;}
.frow select option{background:var(--surface);color:var(--t1);}
.flabel{font-size:13px;font-weight:700;color:var(--t3);margin:12px 0 8px;}
.rrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.rrow label{font-size:13px;color:var(--t3);}
.rrow input[type="time"],.rrow input[type="number"]{min-height:40px;background:var(--field);border:1px solid var(--border);
  border-radius:10px;padding:8px 11px;color:var(--t1);font-family:inherit;font-size:14px;outline:none;}

/* ---- login / sesión / notificaciones ---- */
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 22px;text-align:center;margin-top:48px;}
.login-card p{color:var(--t3);font-size:14px;margin:14px 0 22px;line-height:1.6;}
.login-mark{width:48px;height:48px;border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--blue-soft);color:var(--fiordo);font-size:17px;font-weight:800;}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--t3);}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who button{background:none;border:none;color:var(--fiordo);font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;padding:6px;}
.notif{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--fiordo);
  border-radius:0 14px 14px 0;padding:13px 15px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.notif-ico{width:22px;height:22px;flex-shrink:0;color:var(--fiordo);}
.notif-ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;}
.notif-b{flex:1;min-width:0;}
.notif-t{font-size:14px;font-weight:700;}
.notif-s{font-size:12px;color:var(--t3);line-height:1.45;margin-top:1px;}
.btn-notif{min-height:40px;padding:9px 14px;border-radius:11px;border:none;background:var(--fiordo);
  color:var(--fiordo-ink);font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;}
.btn-notif.on{background:var(--green-soft);color:var(--verde);border:1px solid var(--green-soft-b);}
.btn-notif.blocked{background:none;color:var(--rojo);border:1px solid var(--rojo);}
.btn-notif.paused{background:var(--surface-2);color:var(--t3);border:1px solid var(--border);}

/* ---- navegación inferior fija ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding:7px 6px calc(9px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
  font-size:11px;font-weight:600;color:var(--t3);background:none;border:none;border-radius:12px;cursor:pointer;min-height:48px;}
.nav button.active{color:var(--fiordo);background:var(--blue-soft);}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.nav .badge{position:absolute;transform:translate(15px,-4px);background:var(--rojo);color:#fff;border-radius:10px;
  font-size:10px;font-weight:800;padding:1px 5px;display:none;}


/* ---- cabecera compacta de usuario ---- */
.topacts{display:flex;gap:7px;flex-shrink:0;}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--blue-soft);
  color:var(--fiordo);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.menu-bd{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.18);display:none;}
.menu-bd.open{display:block;}
.menu{position:fixed;top:calc(64px + env(safe-area-inset-top));right:14px;z-index:61;min-width:210px;max-width:calc(100vw - 28px);
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px;display:none;}
.menu.open{display:block;}
.menu .who-name{padding:10px 12px 8px;font-size:13px;color:var(--t3);word-break:break-word;border-bottom:1px solid var(--border-in);margin-bottom:4px;}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:10px;
  padding:12px;font-size:15px;font-weight:600;color:var(--t1);cursor:pointer;min-height:44px;}
.menu button.danger{color:var(--rojo);}

/* ---- aviso de recordatorios en modo compacto ---- */
.notif.compact{border-left-color:var(--verde);padding:9px 13px;margin-bottom:14px;gap:9px;}
.notif.compact .notif-ico{width:17px;height:17px;color:var(--verde);}
.notif.compact .notif-t{font-size:13px;font-weight:600;color:var(--t3);}
.notif.compact .notif-s{display:none;}
.notif.compact .btn-notif{background:none;border:none;color:var(--t3);font-size:13px;font-weight:600;
  padding:6px 4px;min-height:34px;text-decoration:underline;}

/* ---- fila de tarea pulsable ---- */
.trow .tbody{cursor:pointer;}
.trow .tbody:active{opacity:.6;}

/* ---- día vacío compacto en la semana ---- */
.wk-empty{display:flex;align-items:baseline;gap:9px;padding:9px 2px;border-bottom:1px solid var(--border-in);margin-bottom:2px;}
.wk-empty .d{font-size:14px;font-weight:600;color:var(--t3);}
.wk-empty .s{font-size:13px;color:var(--t4);}
.wk-empty:last-of-type{margin-bottom:16px;}

/* ---- hoja de detalle de tarea ---- */
.sheet-bd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;}
.sheet-bd.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:640px;margin:0 auto;
  background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:none;max-height:82vh;overflow-y:auto;}
.sheet.open{display:block;}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 14px;}
.sheet h3{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.3px;}
.sheet .plazo{font-size:14px;margin-top:6px;}
.sheet-meta{margin-top:16px;padding-top:14px;border-top:1px solid var(--border-in);}
.sheet-meta .k{font-size:12px;font-weight:700;color:var(--t3);margin-bottom:3px;}
.sheet-meta .v{font-size:15px;line-height:1.5;margin-bottom:13px;}
.sheet-acts{display:flex;gap:9px;margin-top:6px;}

.view{display:none;} .view.active{display:block;}
.empty-state{text-align:center;padding:44px 20px;color:var(--t3);}
.empty-state p{font-size:15px;line-height:1.6;}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--t1);color:var(--bg);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:99;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.spinner{width:16px;height:16px;border:2px solid rgba(128,128,128,.3);border-top-color:currentColor;
  border-radius:50%;animation:spin .7s linear infinite;display:none;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-prim.loading .spinner{display:block;} .btn-prim.loading .btn-ia-text{display:none;}
</style>
</head>
<body>
<!-- ===== LOGIN ===== -->
<div id="login-gate">
  <div class="login-card">
    <div class="login-mark">FA</div>
    <p>Agenda Concejal Abarca<br>Inicia sesión para ver tus notas, tareas y calendario.</p>
    <button class="btn-prim" style="width:auto;padding:13px 26px;" onclick="__agendaLogin()">Entrar con Google</button>
  </div>
</div>

<div id="app-root" class="hidden">

  <!-- ===== INICIO ===== -->
  <section id="view-inicio" class="view active">
    <div class="topbar">
      <div>
        <div class="h-title">Hoy</div>
        <div class="h-sub" id="inicio-fecha"></div>
      </div>
      <div class="topacts"><button class="theme-btn" onclick="toggleTema()" aria-label="Cambiar tema"><svg class="theme-ico" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg></button><button class="avatar" onclick="toggleMenu()" aria-label="Cuenta"><span class="avatar-ini">·</span></button></div>
    </div>
    <div class="notif" id="notif-banner">
      <div class="notif-ico"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" stroke-linecap="round"/></svg></div>
      <div class="notif-b"><div class="notif-t">Recordatorios</div><div class="notif-s" id="notif-status"></div></div>
      <button class="btn-notif" id="btn-notif" onclick="toggleNotificaciones()">Activar</button>
    </div>
    <div id="inicio-container"></div>
  </section>

  <!-- ===== TAREAS ===== -->
  <section id="view-tareas" class="view">
    <div class="topbar"><div class="h-title">Tareas</div><div class="topacts"><button class="theme-btn" onclick="toggleTema()" aria-label="Cambiar tema"><svg class="theme-ico" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg></button><button class="avatar" onclick="toggleMenu()" aria-label="Cuenta"><span class="avatar-ini">·</span></button></div></div>
    <div class="tools">
      <div class="seg">
        <button id="seg-pend" class="on" onclick="setEstado('pend')">Pendientes</button>
        <button id="seg-done" onclick="setEstado('done')">Completadas</button>
      </div>
      <button class="icon-btn" id="btn-panel" onclick="togglePanel()">
        <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filtrar
      </button>
    </div>
    <div class="panel" id="filter-panel">
      <h3>Cuadrante</h3>
      <div class="chips" id="quad-chips">
        <button class="chip on" onclick="setFilter('all',this)">Todos</button>
        <button class="chip" onclick="setFilter('q1',this)">Urgente e importante</button>
        <button class="chip" onclick="setFilter('q2',this)">Planificar</button>
        <button class="chip" onclick="setFilter('q3',this)">Delegar</button>
        <button class="chip" onclick="setFilter('q4',this)">Sin urgencia</button>
      </div>
      <h3>Ordenar por</h3>
      <div class="chips" id="order-chips">
        <button class="chip on" onclick="setOrden('plazo',this)">Plazo</button>
        <button class="chip" onclick="setOrden('creacion',this)">Creación</button>
        <button class="chip" onclick="setOrden('prioridad',this)">Prioridad</button>
      </div>
    </div>
    <button class="dashed" onclick="toggleAddForm()">+ Agregar tarea</button>
    <div class="form" id="add-form">
      <div class="frow"><input type="text" id="f-title" placeholder="Título de la tarea"></div>
      <div class="frow">
        <select id="f-quad">
          <option value="q1">Urgente e importante</option>
          <option value="q2" selected>Importante — planificar</option>
          <option value="q3">Urgente — delegar</option>
          <option value="q4">Sin urgencia</option>
        </select>
        <input type="date" id="f-date">
      </div>
      <div class="frow"><textarea id="f-note" placeholder="Nota (opcional)"></textarea></div>
      <div class="flabel">Recordatorios puntuales</div>
      <div id="reminder-list"></div>
      <button class="tbtn" onclick="agregarFilaRecordatorio()">+ Agregar recordatorio</button>
      <div class="flabel">Recordatorio diario antes del plazo</div>
      <div class="rrow">
        <label><input type="checkbox" id="f-daily-active"> Activar</label>
        <input type="time" id="f-daily-time" value="09:00">
        <label>desde</label>
        <input type="number" id="f-daily-days" value="3" min="1" max="30" style="width:64px;">
        <label>días antes</label>
      </div>
      <button class="btn-prim" style="margin-top:8px;" onclick="guardarTareaManual()">Guardar tarea</button>
    </div>
    <div id="tasks-container"></div>
  </section>

  <!-- ===== CALENDARIO ===== -->
  <section id="view-calendario" class="view">
    <div class="cal-top">
      <div class="h-title" id="cal-title"></div>
      <div class="topacts">
        <button class="arrow" onclick="calPrev()" aria-label="Anterior"><svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></button>
        <button class="arrow" onclick="calNext()" aria-label="Siguiente"><svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button>
        <button class="avatar" onclick="toggleMenu()" aria-label="Cuenta"><span class="avatar-ini">·</span></button>
      </div>
    </div>
    <div class="seg" style="margin-bottom:16px;">
      <button id="seg-mes" onclick="setCalModo('mes')">Mes</button>
      <button id="seg-semana" class="on" onclick="setCalModo('semana')">Semana</button>
    </div>
    <div id="cal-mes-wrap" style="display:none;">
      <div class="weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid" id="cal-grid"></div>
      <h2 class="sec" id="detail-date"></h2>
      <div id="detail-list"></div>
    </div>
    <div id="cal-semana-wrap">
      <div class="week-band" id="week-band"></div>
      <div id="week-agenda"></div>
    </div>
    <div class="row2" style="margin-top:6px;">
      <button class="btn-sec" onclick="toggleAddEventForm()">+ Evento</button>
      <button class="btn-sec" onclick="switchView('tareas');toggleAddForm();">+ Tarea</button>
    </div>
    <div class="form" id="add-event-form">
      <div class="frow"><input type="text" id="e-title" placeholder="Título del evento"></div>
      <div class="frow"><input type="date" id="e-date"><input type="time" id="e-start" placeholder="Inicio"></div>
      <div class="frow"><input type="time" id="e-end" placeholder="Fin"><input type="text" id="e-loc" placeholder="Lugar"></div>
      <div class="frow">
        <select id="e-recur">
          <option value="">No se repite</option>
          <option value="daily">Cada día</option>
          <option value="weekly">Cada semana</option>
          <option value="monthly">Cada mes</option>
        </select>
        <input type="number" id="e-reminder" placeholder="Avisar min. antes" min="0" max="1440">
      </div>
      <button class="btn-prim" style="margin-top:8px;" onclick="guardarEvento()">Guardar evento</button>
    </div>
  </section>

  <!-- ===== NOTAS ===== -->
  <section id="view-notas" class="view">
    <div class="topbar"><div class="h-title">Notas</div><div class="topacts"><button class="theme-btn" onclick="toggleTema()" aria-label="Cambiar tema"><svg class="theme-ico" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg></button><button class="avatar" onclick="toggleMenu()" aria-label="Cuenta"><span class="avatar-ini">·</span></button></div></div>
    <textarea class="note-field" id="new-note-input" placeholder="¿Qué necesitas recordar?"></textarea>
    <div class="note-meta" id="note-char-count"></div>
    <div class="row2">
      <button class="btn-prim" onclick="guardarNotaRapida()">Guardar</button>
      <button class="btn-sec" id="btn-ia" onclick="procesarConIA()">
        <span class="btn-ia-text">Convertir en tareas</span><span class="spinner"></span>
      </button>
    </div>
    <div class="pv" id="preview-box">
      <h3>Tareas propuestas</h3>
      <div id="preview-list"></div>
      <div class="row2" style="margin:12px 0 0;">
        <button class="btn-prim" onclick="confirmarTareas()">Agregar seleccionadas</button>
        <button class="btn-sec" onclick="descartarPreview()">Descartar</button>
      </div>
    </div>
    <h2 class="sec">Recientes</h2>
    <div id="saved-notes-list"></div>
  </section>

  <div class="menu-bd" id="menu-bd" onclick="toggleMenu()"></div>
  <div class="menu" id="user-menu">
    <div class="who-name" id="who-email"></div>
    <button class="danger" onclick="__agendaLogout()">Cerrar sesión</button>
  </div>

  <div class="sheet-bd" id="sheet-bd" onclick="cerrarDetalle()"></div>
  <div class="sheet" id="task-sheet"><div class="sheet-grab"></div><div id="sheet-body"></div></div>

  <!-- ===== NAVEGACIÓN ===== -->
  <nav class="nav">
    <button id="nav-inicio" class="active" onclick="switchView('inicio')">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>Inicio</button>
    <button id="nav-tareas" onclick="switchView('tareas')">
      <svg viewBox="0 0 24 24"><path d="M4 6.5 6 8.5 9.5 5"/><path d="M4 12.5 6 14.5 9.5 11"/><path d="M4 18.5 6 20.5 9.5 17"/><path d="M13 7h7M13 13h7M13 19h7"/></svg>Tareas<span class="badge" id="pending-badge"></span></button>
    <button id="nav-calendario" onclick="switchView('calendario')">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario</button>
    <button id="nav-notas" onclick="switchView('notas')">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>Notas</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import {
  auth, db, loginConGoogle, logout, onAuthChange, itemsCollection, itemDoc,
  notesCollection, noteDoc,
  setDoc, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp,
  registrarPush, desactivarPush, AI_CONVERT_URL
} from './firebase-init.js';

// ---------- estado ----------
var items = []; // tareas + eventos, sincronizados desde Firestore
var notes = [];
var currentFilter = 'all', previewTasks = [], editingId = null;
var formReminders = []; // recordatorios puntuales del formulario de tarea en edición/creación
var currentUid = null;
var unsubItems = null, unsubNotes = null;
var TODAY = new Date();
var viewYear = TODAY.getFullYear(), viewMonth = TODAY.getMonth();
var selectedKey = fmtKey(TODAY);

// ---------- registro de service worker ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW no registrado', e); });
}

// ---------- auth ----------
window.__agendaLogin = function(){ loginConGoogle().catch(function(e){ showToast('No se pudo iniciar sesión: '+e.message); }); };
window.__agendaLogout = function(){ logout(); };

onAuthChange(function(user){
  if (unsubItems) unsubItems();
  if (unsubNotes) unsubNotes();
  if (user) {
    currentUid = user.uid;
    document.getElementById('login-gate').classList.add('hidden');
    document.getElementById('app-root').classList.remove('hidden');
    var nombre = user.displayName || user.email || 'Sesión activa';
    document.getElementById('who-email').textContent = nombre;
    pintarAvatar(user.displayName || '');
    unsubItems = onSnapshot(query(itemsCollection(currentUid)), function(snap){
      items = [];
      snap.forEach(function(d){ items.push(Object.assign({id:d.id}, d.data())); });
      renderTasks(); updateBadge(); renderCalendar(); renderInicio();
    });
    unsubNotes = onSnapshot(query(notesCollection(currentUid)), function(snap){
      notes = [];
      snap.forEach(function(d){ notes.push(Object.assign({id:d.id}, d.data())); });
      renderNotes();
    });
    initNotificaciones();
  } else {
    currentUid = null;
    document.getElementById('login-gate').classList.remove('hidden');
    document.getElementById('app-root').classList.add('hidden');
  }
});

// ---------- vistas ----------
window.switchView = function(v){
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.nav button').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  window.scrollTo(0,0);
  if (v === 'calendario') renderCalendar();
  if (v === 'inicio') renderInicio();
};

// ---------- notificaciones ----------
// El navegador no deja "revocar" el permiso de notificaciones por código, así
// que llevamos nosotros mismos el estado de "activas/pausadas en este
// dispositivo" en localStorage (independiente del permiso del navegador).
// Si nunca se tocó el botón desde esta actualización, asumimos que sigue
// activo tal como estaba (para no confundir a alguien que ya las tenía andando).
function pushActivoLocal(){ return localStorage.getItem('acPushActivo') !== '0'; }

function initNotificaciones(){
  var perm = ('Notification' in window) ? Notification.permission : 'denied';
  var btn = document.getElementById('btn-notif');
  var status = document.getElementById('notif-status');
  btn.classList.remove('on','blocked','paused');
  if (perm === 'denied') {
    btn.textContent = 'Bloqueadas'; btn.classList.add('blocked');
    status.textContent = 'Bloqueaste las notificaciones — actívalas desde el ícono de candado junto a la dirección del sitio en Chrome';
  } else if (perm === 'granted' && pushActivoLocal()) {
    btn.textContent = 'Activadas'; btn.classList.add('on');
    status.textContent = 'Recibirás recordatorios aunque la app esté cerrada — toca para pausar';
  } else if (perm === 'granted' && !pushActivoLocal()) {
    btn.textContent = 'Pausadas — reactivar'; btn.classList.add('paused');
    status.textContent = 'No recibirás recordatorios en este dispositivo hasta que las reactives';
  } else {
    btn.textContent = 'Activar';
    status.textContent = 'Activa las notificaciones para recibir recordatorios reales';
  }
  var banner = document.getElementById('notif-banner');
  if (banner) {
    var activas = btn.classList.contains('on');
    banner.classList.toggle('compact', activas);
    document.querySelector('#notif-banner .notif-t').textContent =
      activas ? 'Recordatorios activados' : 'Recordatorios';
    if (activas) btn.textContent = 'Pausar';
  }
}
window.toggleNotificaciones = function(){
  if (!currentUid) { showToast('No hay sesión activa — vuelve a iniciar sesión', 5000); return; }
  var perm = ('Notification' in window) ? Notification.permission : 'denied';

  if (perm === 'granted' && pushActivoLocal()) {
    // Estaban activas -> las pausamos en este dispositivo
    desactivarPush(currentUid).then(function(){
      localStorage.setItem('acPushActivo', '0');
      initNotificaciones();
      showToast('Recordatorios pausados en este dispositivo');
    }).catch(function(err){
      console.error('desactivarPush error', err);
      showToast('No se pudo pausar: ' + (err && err.message ? err.message : err), 6000);
    });
    return;
  }

  showToast('Solicitando permiso...', 4000);
  registrarPush(currentUid).then(function(token){
    if (token) {
      localStorage.setItem('acPushActivo', '1');
      initNotificaciones(); showToast('Recordatorios activados');
    } else {
      showToast('No se pudo activar — revisa permisos del navegador', 6000);
    }
  }).catch(function(err){
    console.error('registrarPush error', err);
    showToast('Error al activar: ' + (err && err.message ? err.message : err), 8000);
  });
};

// ---------- notas ----------
document.getElementById('new-note-input').addEventListener('input', function(){
  document.getElementById('note-char-count').textContent = this.value.length+' caracteres';
});

window.convertirNota = function(id){
  var nota = notes.find(function(n){ return n.id===id; });
  if (!nota) return;
  document.getElementById('new-note-input').value = nota.text;
  document.getElementById('note-char-count').textContent = nota.text.length+' caracteres';
  procesarConIA();
};
window.eliminarNota = function(id){
  deleteDoc(noteDoc(currentUid, id));
};

window.procesarConIA = function(){
  var text = document.getElementById('new-note-input').value.trim();
  if (!text) { showToast('Escribe algo primero'); return; }
  var btn = document.getElementById('btn-ia');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('preview-box').style.display = 'none';
  var noteId = uid();
  setDoc(noteDoc(currentUid, noteId), { text: text, ts: Date.now() });
  fetch(AI_CONVERT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text })
  }).then(function(r){ return r.json(); }).then(function(parsed){
    previewTasks = parsed.tareas.map(function(t){ return { id: uid(), titulo: t.titulo, cuadrante: t.cuadrante, fecha: t.fecha, nota: t.nota, selected: true }; });
    mostrarPreview();
    document.getElementById('new-note-input').value = '';
    document.getElementById('note-char-count').textContent = '0 caracteres';
    btn.disabled = false; btn.classList.remove('loading');
  }).catch(function(err){
    console.error(err);
    showToast('Error al procesar. Revisa que la función aiConvert esté desplegada.');
    btn.disabled = false; btn.classList.remove('loading');
  });
};

window.confirmarTareas = function(){
  var sel = previewTasks.filter(function(t){ return t.selected; });
  if (!sel.length) { showToast('Selecciona al menos una'); return; }
  sel.forEach(function(t){
    var id = uid();
    setDoc(itemDoc(currentUid, id), { type:'task', title:t.titulo, quad:t.cuadrante, date:t.fecha||null, note:t.nota||'', reminder:null, notified:false, done:false, created: Date.now() });
  });
  descartarPreview();
  showToast(''+sel.length+' tarea'+(sel.length>1?'s':'')+' agregada'+(sel.length>1?'s':''));
  switchView('tareas');
};
window.descartarPreview = function(){ document.getElementById('preview-box').style.display='none'; previewTasks=[]; };

// ---------- tareas ----------
window.toggleAddForm = function(){
  var willOpen = !document.getElementById('add-form').classList.contains('open');
  if (willOpen && !editingId) {
    // se abre para una tarea NUEVA (no venimos de "Editar") -> dejar todo limpio
    document.getElementById('f-title').value = '';
    document.getElementById('f-date').value = '';
    document.getElementById('f-note').value = '';
    document.getElementById('f-quad').value = 'q1';
    document.getElementById('f-daily-active').checked = false;
    document.getElementById('f-daily-days').value = '';
    document.getElementById('f-daily-time').value = '';
    formReminders = [];
    renderReminderRows();
    document.querySelector('#add-form .btn-save').textContent = 'Guardar tarea';
  }
  document.getElementById('add-form').classList.toggle('open');
};

// ---- recordatorios puntuales (múltiples por tarea) ----
window.agregarFilaRecordatorio = function(){
  formReminders.push({ id: uid(), date:'', time:'' });
  renderReminderRows();
};
window.quitarFilaRecordatorio = function(id){
  formReminders = formReminders.filter(function(r){ return r.id!==id; });
  renderReminderRows();
};
window.actualizarFilaRecordatorio = function(id, field, val){
  var r = formReminders.find(function(x){ return x.id===id; });
  if (r) r[field] = val;
};

window.guardarTareaManual = function(){
  var title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Escribe el título'); return; }

  var reminders = {};
  formReminders.forEach(function(r){
    if (r.date && r.time) reminders[r.id] = { date:r.date, time:r.time, notified:false };
  });

  var dailyActive = document.getElementById('f-daily-active').checked;
  var dailyDays = Number(document.getElementById('f-daily-days').value) || 0;
  var dailyTime = document.getElementById('f-daily-time').value;
  var dueDate = document.getElementById('f-date').value || null;

  if (dailyActive && !dueDate) {
    showToast('El recordatorio diario necesita que la tarea tenga fecha límite'); return;
  }
  var reminderDaily = (dailyActive && dailyDays>0 && dailyTime) ? { active:true, daysBefore:dailyDays, time:dailyTime, lastFiredDate:null } : null;

  var data = {
    type:'task', title:title, quad:document.getElementById('f-quad').value,
    date:dueDate,
    note:document.getElementById('f-note').value.trim(),
    reminder:null, // el campo antiguo de un solo recordatorio queda en desuso
    reminders:reminders,
    reminderDaily:reminderDaily,
    notified:false
  };
  if (editingId) {
    updateDoc(itemDoc(currentUid, editingId), data);
    editingId = null;
    document.querySelector('#add-form .btn-save').textContent = 'Guardar tarea';
  } else {
    data.done = false; data.created = Date.now();
    setDoc(itemDoc(currentUid, uid()), data);
  }
  ['f-title','f-date','f-note'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('f-daily-active').checked = false;
  document.getElementById('f-daily-days').value = '';
  document.getElementById('f-daily-time').value = '';
  formReminders = [];
  renderReminderRows();
  document.getElementById('add-form').classList.remove('open');
  showToast('Tarea guardada');
};

window.toggleDone = function(id){
  var t = items.find(function(x){ return x.id===id; });
  if (!t) return;
  updateDoc(itemDoc(currentUid, id), { done: !t.done });
};
window.eliminarTarea = function(id){
  deleteDoc(itemDoc(currentUid, id));
  showToast('Tarea eliminada');
};
window.editarTarea = function(id){
  var found = items.find(function(x){ return x.id===id; });
  if (!found) return;
  editingId = id;
  document.getElementById('f-title').value = found.title;
  document.getElementById('f-quad').value = found.quad;
  document.getElementById('f-date').value = found.date||'';
  document.getElementById('f-note').value = found.note||'';

  formReminders = [];
  if (found.reminders && typeof found.reminders === 'object' && Object.keys(found.reminders).length) {
    Object.keys(found.reminders).forEach(function(rid){
      var r = found.reminders[rid];
      formReminders.push({ id: rid, date:r.date||'', time:r.time||'' });
    });
  } else if (found.reminder && found.reminder.date) {
    // migra el recordatorio único del formato antiguo a una fila editable
    formReminders.push({ id: uid(), date:found.reminder.date, time:found.reminder.time||'' });
  }
  renderReminderRows();

  var fd = found.reminderDaily;

function fmtRecordatorio(fecha, hora){
  if (!fecha) return hora || '';
  var d = new Date(fecha+'T00:00:00');
  return cap(d.toLocaleDateString('es-CL',{day:'numeric',month:'short'}).replace('.','')) + (hora?' · '+hora:'');
}
function reminderSummary(t){
  var parts = [];
  if (t.reminders && typeof t.reminders === 'object') {
    var keys = Object.keys(t.reminders);
    if (keys.length === 1) {
      var r = t.reminders[keys[0]];
      parts.push(fmtRecordatorio(r.date, r.time));
    } else if (keys.length > 1) {
      parts.push(''+keys.length+' recordatorios');
    }
  } else if (t.reminder && t.reminder.date) {
    parts.push(fmtRecordatorio(t.reminder.date, t.reminder.time));
  }
  if (t.reminderDaily && t.reminderDaily.active) {
    parts.push('Diario '+t.reminderDaily.time+' (desde '+t.reminderDaily.daysBefore+'d antes)');
  }
  return parts;
}

// ---------- helpers de plazo ----------
// Regla: rojo = ya vencida (día anterior o antes). Ocre = vence hoy o mañana.
// Neutro = futura. Gris = sin fecha. Una tarea con fecha de hoy NO vence
// hasta que empieza el día siguiente.
function diasHasta(dateStr){
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var d = new Date(dateStr+'T00:00:00');
  return Math.round((d-hoy)/86400000);
}
function plazoInfo(t){
  if (!t.date) return { grupo:'sinfecha', clase:'gris', texto:'Sin fecha', borde:'' };
  var n = diasHasta(t.date);
  if (n < 0) return { grupo:'atrasada', clase:'rojo', borde:'late',
    texto:'Vencida · '+Math.abs(n)+' día'+(Math.abs(n)>1?'s':'') };
  if (n === 0) return { grupo:'hoy', clase:'ocre', borde:'today', texto:'Vence hoy' };
  if (n === 1) return { grupo:'proxima', clase:'ocre', borde:'today', texto:'Vence mañana' };
  return { grupo:'proxima', clase:'', borde:'', texto: fmtCorta(t.date) };
}
function fmtCorta(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'}).replace('.','');
}
function esc2(s){ return esc(s); }

function filaTarea(t){
  var p = plazoInfo(t);
  return '<div class="trow '+(p.borde||'')+(t.done?' done':'')+'">'

    + (t.done?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</button>'
    + '<div class="tbody" onclick="abrirDetalle(\''+t.id+'\')">'
    + '<div class="ttitle">'+esc(t.title)+'</div>'
    + (t.done?'':'<div class="tplazo '+p.clase+'">'+p.texto+'</div>')
    + '</div></div>';
}
function filaTareaCompacta(t){
  var p = plazoInfo(t);
  return '<div class="trow '+(p.borde||'')+'">'
    + '<button class="cb" onclick="toggleDone(\''+t.id+'\')" aria-label="Completar"></button>'
    + '<div class="tbody" onclick="abrirDetalle(\''+t.id+'\')"><div class="ttitle">'+esc(t.title)+'</div>'
    + '<div class="tplazo '+p.clase+'">'+p.texto+'</div></div></div>';

function renderInicio(){
  var el = document.getElementById('inicio-container');
  if (!el) return;
  var hoy = new Date();
  var fx = document.getElementById('inicio-fecha');
  if (fx) fx.textContent = cap(hoy.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}));

  var pend = items.filter(function(t){ return t.type==='task' && !t.done; });
  pend.sort(ordenarPorPlazo);
  var proximos = eventosFuturos();
  var html = '';

  if (proximos.length){
    var e = proximos[0];
    html += '<div class="next-evt"><div class="lbl">'+(e.enCurso?'Ahora':'Próximo')+'</div>'
      + '<div class="body"><div class="hora">'+esc(e.start||'')+'</div><div>'
      + '<div class="tt">'+esc(e.title)+'</div>'
      + (e.loc?'<div class="loc">'+esc(e.loc)+'</div>':'')
      + (e.dayLabel && e.dayLabel!=='Hoy' ? '<div class="loc">'+e.dayLabel+'</div>':'')
      + '</div></div></div>';
  }

  html += '<h2 class="sec">Pendientes <span class="count">· '+pend.length+'</span></h2>';
  if (!pend.length){
    html += '<div class="blk"><div class="empty-state"><p>Nada pendiente por ahora</p></div></div>';
  } else {

    });
    html += '</div>';
    html += '<button class="btn-wide" onclick="switchView(\'tareas\')">Ver todas las tareas · '+pend.length+'</button>';
  }

  var resto = proximos.slice(1,4);

        + '<span class="et">'+esc(e.title)+'</span></div>';

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// Eventos desde ahora hacia adelante (14 días), respetando recurrencia.
// "Ahora" solo si el evento tiene hora de término cargada.
function eventosFuturos(){
  var out = [], now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  for (var i=0;i<14;i++){
    var d = new Date(); d.setDate(d.getDate()+i);
    var key = fmtKey(d);
    var it = itemsFor(key);
    it.evts.forEach(function(e){
      var startMin = e.start ? (parseInt(e.start.slice(0,2),10)*60 + parseInt(e.start.slice(3,5),10)) : 0;
      var enCurso = false;
      if (i===0){
        if (e.end){
          var endMin = parseInt(e.end.slice(0,2),10)*60 + parseInt(e.end.slice(3,5),10);
          if (nowMin >= startMin && nowMin < endMin) enCurso = true;
          else if (nowMin >= endMin) return;
        } else {
          if (nowMin > startMin) return;
        }
      }
      out.push(Object.assign({}, e, {
        enCurso: enCurso,
        dayLabel: i===0 ? 'Hoy' : cap(d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})),
        dayShort: i===0 ? 'Hoy' : cap(d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric'}).replace('.','')),
        _sort: i*1440 + startMin
      }));
    });
  }
  out.sort(function(a,b){ return a._sort-b._sort; });
  return out;
}

var ORDEN_QUAD = { q1:0, q3:1, q2:2, q4:3 };
function ordenarPorPlazo(a,b){
  if (a.date && b.date) return a.date.localeCompare(b.date);
  if (a.date) return -1; if (b.date) return 1;
  return (b.created||0)-(a.created||0);
}
function comparador(){
  if (currentOrden==='creacion') return function(a,b){ return (b.created||0)-(a.created||0); };
  if (currentOrden==='prioridad') return function(a,b){
    var d = (ORDEN_QUAD[a.quad]||9)-(ORDEN_QUAD[b.quad]||9);
    return d !== 0 ? d : ordenarPorPlazo(a,b);
  };
  return ordenarPorPlazo;
}
function renderTasks(){
  var container = document.getElementById('tasks-container');
  if (!container) return;
  var tasks = items.filter(function(t){ return t.type==='task'; });
  var base = tasks.filter(function(t){ return currentEstado==='done' ? t.done : !t.done; });
  if (currentFilter && currentFilter!=='all') base = base.filter(function(t){ return t.quad===currentFilter; });

  if (!base.length){
    container.innerHTML = '<div class="empty-state"><p>'
      + (currentEstado==='done' ? 'Aún no has completado tareas' : 'No hay tareas pendientes aquí')
      + '</p></div>';
    return;
  }
  if (currentEstado==='done'){
    base.sort(function(a,b){ return (b.created||0)-(a.created||0); });
    container.innerHTML = bloque(base);
    return;
  }
  base.sort(comparador());
  var grupos = [
    { k:'atrasada', t:'Atrasadas', cls:'rojo' },
    { k:'hoy',      t:'Hoy',       cls:'' },
    { k:'proxima',  t:'Próximas',  cls:'' },
    { k:'sinfecha', t:'Sin fecha', cls:'gris' }
  ];
  var html = '';
  grupos.forEach(function(g){
    var arr = base.filter(function(t){ return plazoInfo(t).grupo === g.k; });
    if (!arr.length) return;
    html += '<h2 class="sec '+g.cls+'">'+g.t+' <span class="count">· '+arr.length+'</span></h2>' + bloque(arr);
  });
  container.innerHTML = html;
}
function bloque(arr){
  var h = '<div class="blk" style="margin-bottom:20px;">';
  arr.forEach(function(t,i){
    h += filaTarea(t);
    if (i < arr.length-1) h += '<div class="blk-sep"></div>';
  });
  return h + '</div>';
}

function moverSemana(d){
  var base = new Date(selectedKey+'T00:00:00');
  base.setDate(base.getDate()+d);
  selectedKey = fmtKey(base);
  viewYear = base.getFullYear(); viewMonth = base.getMonth();
  renderCalendar();
}
function lunesDe(d){
  var x = new Date(d.getTime());
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  x.setHours(0,0,0,0);
  return x;
}
function renderCalendar(){
  var titulo = document.getElementById('cal-title');
  if (calModo==='mes'){
    var first = new Date(viewYear, viewMonth, 1);
    if (titulo) titulo.textContent = cap(first.toLocaleDateString('es-CL',{month:'long',year:'numeric'}));
    renderMes(first);
    renderDetail();
  } else {
    var lun = lunesDe(new Date(selectedKey+'T00:00:00'));
    if (titulo) titulo.textContent = cap(lun.toLocaleDateString('es-CL',{month:'long',year:'numeric'}));
    renderWeek(lun);
  }
}
function renderMes(first){
  var offset = (first.getDay()+6)%7;
  var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  var grid = document.getElementById('cal-grid');
  if (!grid) return;
  var html = '', totalCells = Math.ceil((offset+daysInMonth)/7)*7;
  for (var i=0;i<totalCells;i++){
    var dayNum = i-offset+1;
    var inMonth = dayNum>=1 && dayNum<=daysInMonth;
    var key = inMonth ? fmtKey(new Date(viewYear,viewMonth,dayNum)) : '';
    var isToday = key === fmtKey(new Date());
    var isSel = key === selectedKey;
    var it = inMonth ? itemsFor(key) : {evts:[],tasks:[]};
    var dots = '';
    it.evts.slice(0,1).forEach(function(){ dots += '<span class="dot evt"></span>'; });
    it.tasks.slice(0,3).forEach(function(t){
      var p = plazoInfo(t);
      dots += '<span class="dot '+(p.grupo==='atrasada'?'late':(p.grupo==='hoy'?'today':'fut'))+'"></span>';
    });
    html += '<div class="day-cell'+(inMonth?'':' other-month')+(isToday?' today':'')+(isSel?' sel':'')+'" '
      + (inMonth?'onclick="selectDay(\''+key+'\')"':'')
      + '><span class="day-num">'+(inMonth?dayNum:'')+'</span><div class="day-dots">'+dots+'</div></div>';
  }
  grid.innerHTML = html;
}
function renderWeek(lun){
  var hoyKey = fmtKey(new Date());
  var band = '', agenda = '';
  for (var i=0;i<7;i++){
    var d = new Date(lun.getTime()); d.setDate(lun.getDate()+i);
    var key = fmtKey(d);
    var esHoy = key===hoyKey, esSel = key===selectedKey, finde = i>=5;
    band += '<button class="wb-day'+(esHoy?' today':'')+(esSel&&!esHoy?' sel':'')+(finde&&!esHoy?' fin':'')+'" '
      + 'onclick="selectDay(\''+key+'\')">'
      + '<div class="d">'+cap(d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','')).slice(0,3)+'</div>'
      + '<div class="n">'+d.getDate()+'</div></button>';

    var it = itemsFor(key);
    var pend = it.tasks.filter(function(t){ return !t.done; });
    var etiqueta = cap(d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric'}));

    if (!it.evts.length && !pend.length){
      agenda += '<div class="wk-empty"><span class="d">'+etiqueta+'</span><span class="s">Sin actividad</span></div>';
      continue;
    }
    agenda += '<h2 class="sec" style="margin-top:16px;">'+etiqueta
      + (esHoy?' <span style="color:var(--verde);font-weight:700;">· hoy</span>':'') + '</h2>';
    agenda += '<div class="blk'+(esHoy?' today-blk':'')+'" style="margin-bottom:18px;">';
    var filas = [];
    it.evts.forEach(function(e){
      filas.push('<div class="erow"><span class="when w-narrow">'+esc(e.start||'')+'</span><div>'
        + '<div class="et">'+esc(e.title)+'</div>'
        + (e.loc?'<div class="eloc">'+esc(e.loc)+'</div>':'')+'</div></div>');
    });
    pend.forEach(function(t){
      var p = plazoInfo(t);
      var pasada = p.grupo==='atrasada';
      var cls = pasada ? 'vence-rojo' : (p.clase==='ocre' ? 'vence-ocre' : 'vence-neutro');
      filas.push('<div class="erow"><span class="when '+cls+'">'+(pasada?'venció':'vence')+'</span>'
        + '<span class="et">'+esc(t.title)+'</span></div>');
    });
    agenda += filas.join('<div class="blk-sep plain"></div>') + '</div>';
  }
  document.getElementById('week-band').innerHTML = band;
  document.getElementById('week-agenda').innerHTML = agenda;
}

function mostrarPreview(){
  var qL = { q1:'Urgente e importante', q2:'Planificar', q3:'Delegar', q4:'Sin urgencia' };
  var html = '';
  previewTasks.forEach(function(t){
    html += '<div class="pv-task sel" id="pt-'+t.id+'" onclick="togglePT(\''+t.id+'\')">'
      + '<div class="pv-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>'
      + '<div><div class="pv-t">'+esc(t.titulo)+'</div>'
      + '<div class="pv-m">'+qL[t.cuadrante]+(t.fecha?' · '+t.fecha:'')+'</div>'
      + (t.nota?'<div class="pv-m">'+esc(t.nota)+'</div>':'')+'</div></div>';
  });
  document.getElementById('preview-list').innerHTML = html;
  document.getElementById('preview-box').style.display = 'block';
}
window.togglePT = function(id){
  previewTasks.forEach(function(t){
    if (t.id===id){ t.selected=!t.selected; document.getElementById('pt-'+id).classList.toggle('sel', t.selected); }
  });
};
function renderReminderRows(){
  var el = document.getElementById('reminder-list');
  if (!el) return;
  if (!formReminders.length){
    el.innerHTML = '<div class="empty-line" style="margin-bottom:8px;">Sin recordatorios puntuales (opcional)</div>';
    return;
  }
  var html = '';
  formReminders.forEach(function(r){
    html += '<div class="rrow">'
      + '<input type="date" value="'+(r.date||'')+'" onchange="actualizarFilaRecordatorio(\''+r.id+'\',\'date\',this.value)">'
      + '<input type="time" value="'+(r.time||'')+'" onchange="actualizarFilaRecordatorio(\''+r.id+'\',\'time\',this.value)">'
      + '<button class="tbtn del" onclick="quitarFilaRecordatorio(\''+r.id+'\')">Quitar</button></div>';
  });
  el.innerHTML = html;
}

function updateBadge(){
  var n = items.filter(function(t){ return t.type==='task' && !t.done; }).length;
  var b = document.getElementById('pending-badge');
  b.textContent = n; b.style.display = n?'inline':'none';
}

// ---------- calendario ----------
function fmtKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function occursOnDate(evt, dateKey){
  if (!evt.date) return false;
  if (!evt.recurrence || !evt.recurrence.freq) return evt.date === dateKey;
  if (dateKey < evt.date) return false;
  var base = new Date(evt.date+'T00:00:00');
  var d = new Date(dateKey+'T00:00:00');
  if (evt.recurrence.freq === 'weekly') return base.getDay() === d.getDay();
  if (evt.recurrence.freq === 'monthly') return base.getDate() === d.getDate();
  return false;
}
function itemsFor(key){
  var evts = items.filter(function(i){ return i.type==='event' && occursOnDate(i, key); });
  var tasks = items.filter(function(i){ return i.type==='task' && i.date===key; });
  return { evts: evts, tasks: tasks };
}

window.changeMonth = function(delta){
  viewMonth += delta;
  if (viewMonth<0){ viewMonth=11; viewYear--; } if (viewMonth>11){ viewMonth=0; viewYear++; }
  renderCalendar();
};
window.selectDay = function(key){ selectedKey = key; renderCalendar(); };

window.toggleAddEventForm = function(){ document.getElementById('add-event-form').classList.toggle('open'); };
window.guardarEvento = function(){
  var title = document.getElementById('e-title').value.trim();
  var date = document.getElementById('e-date').value;
  if (!title || !date) { showToast('Título y fecha son obligatorios'); return; }
  var recurVal = document.getElementById('e-recur').value;
  var reminderVal = document.getElementById('e-reminder').value;
  var data = {
    type:'event', title:title, date:date,
    start:document.getElementById('e-start').value||null,
    end:document.getElementById('e-end').value||null,
    loc:document.getElementById('e-loc').value.trim(),
    recurrence: recurVal ? { freq: recurVal } : null,
    reminderMinutesBefore: reminderVal ? Number(reminderVal) : null,
    notified:false, created: Date.now()
  };
  setDoc(itemDoc(currentUid, uid()), data);
  ['e-title','e-date','e-start','e-end','e-loc'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('e-recur').value=''; document.getElementById('e-reminder').value='';
  document.getElementById('add-event-form').classList.remove('open');
  selectedKey = date;
  showToast('Evento guardado');
};
window.eliminarEvento = function(id){
  deleteDoc(itemDoc(currentUid, id));
  showToast('Evento eliminado');
};

// ---------- utilidades ----------
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function showToast(msg, duration){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, duration||2500); }

renderCalendar();
</script>
